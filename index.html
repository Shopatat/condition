<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Condition</title>
<meta name="description" content="Pomodoro sans chiffres : un électrocardiogramme façon Resident Evil passe de Ok à Attention puis à Danger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Condition">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/librecaslon-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sharetechmono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <div class="phase-plate" data-phase aria-hidden="true">Concentration</div>
  <div class="monitor">
    <div class="screen" id="screen">
      <canvas id="grid"></canvas>
      <canvas id="trace"></canvas>
      <canvas id="head"></canvas>
      <div class="tag center" id="phaseTag" data-phase>Concentration</div>
    </div>
    <div class="status" id="status" aria-live="polite">Ok</div>
  </div>

  <div class="bar">
    <div class="controls">
      <button class="primary" id="toggle" type="button" data-ico="play">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="i-play" d="M8 5l11 7-11 7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></span>
        <span class="lbl">Démarrer</span>
      </button>
      <button id="skip" type="button" disabled>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h12v2h-1.2c-.3 3.2-2.2 5.3-3.9 7 1.7 1.7 3.6 3.8 3.9 7H18v2H6v-2h1.2c.3-3.2 2.2-5.3 3.9-7C9.4 10.3 7.5 8.2 7.2 5H6zm3.2 2c.3 2.4 1.7 4 2.8 5.2 1.1-1.2 2.5-2.8 2.8-5.2zM12 13.8c-1.1 1.2-2.5 2.8-2.8 5.2h5.6c-.3-2.4-1.7-4-2.8-5.2z"/></svg></span>
        <span class="lbl">Prendre ma pause</span>
      </button>
      <button id="reset" type="button">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5h2.2A6 6 0 1 0 12 6v3L7 5l5-4z"/></svg></span>
        <span class="lbl">Réinitialiser</span>
      </button>
      <button id="gear" type="button" aria-pressed="false" aria-controls="settings">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zm2 2v14h10V7h-2.2V5zm2 4h6v1.6H9zm0 3.2h6v1.6H9zm0 3.2h4v1.6H9z"/></svg></span>
        <span class="lbl">Réglages</span>
      </button>
    </div>
    <div class="sessions">Sessions <span class="dots" id="dots"></span></div>
  </div>

  <form class="settings" id="settings" hidden>
    <label class="field">Version de l'écran<select id="cfg-theme">
      <option value="moniteur">1 · Moniteur</option>
      <option value="remake">2 · Enregistreur (REmake)</option>
    </select></label>
    <label class="field">Concentration (min)<input id="cfg-work" type="number" min="1" max="180" step="1"></label>
    <label class="field">Pause courte (min)<input id="cfg-short" type="number" min="1" max="60" step="1"></label>
    <label class="field">Pause longue (min)<input id="cfg-long" type="number" min="1" max="90" step="1"></label>
    <label class="field">Sessions avant la pause longue<input id="cfg-cycles" type="number" min="1" max="12" step="1"></label>
    <label class="check"><input id="cfg-auto" type="checkbox"> Relancer la concentration après la pause</label>
    <label class="check"><input id="cfg-beep" type="checkbox"> Bip cardiaque</label>
    <label class="check"><input id="cfg-alarm" type="checkbox"> Alarme de fin de phase</label>
    <label class="check"><input id="cfg-demo" type="checkbox"> Mode démo (1 min = 1 s)</label>
  </form>

  <p class="hint">Aucun chiffre : seule la courbe indique où tu en es. Pendant une session, touche l'écran pour retrouver les commandes. Une pause prise plus tôt est raccourcie d'autant. <kbd>Espace</kbd> démarrer ou suspendre, <kbd>R</kbd> réinitialiser.</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
