<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Condition</title>
<meta name="description" content="Pomodoro sans chiffres : un électrocardiogramme façon Resident Evil passe de Ok à Attention puis à Danger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Condition">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/librecaslon-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sharetechmono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <div class="monitor">
    <div class="screen" id="screen">
      <canvas id="grid"></canvas>
      <canvas id="trace"></canvas>
      <canvas id="head"></canvas>
      <div class="tag center" id="phaseTag">Concentration</div>
    </div>
    <div class="status" id="status" aria-live="polite">Ok</div>
  </div>

  <div class="bar">
    <div class="controls">
      <button class="primary" id="toggle" type="button">Démarrer</button>
      <button id="skip" type="button" disabled>Prendre ma pause</button>
      <button id="reset" type="button">Réinitialiser</button>
      <button id="gear" type="button" aria-pressed="false" aria-controls="settings">Réglages</button>
    </div>
    <div class="sessions">Sessions <span class="dots" id="dots"></span></div>
  </div>

  <form class="settings" id="settings" hidden>
    <label class="field">Version de l'écran<select id="cfg-theme">
      <option value="moniteur">1 · Moniteur</option>
      <option value="remake">2 · Enregistreur (REmake)</option>
    </select></label>
    <label class="field">Concentration (min)<input id="cfg-work" type="number" min="1" max="180" step="1"></label>
    <label class="field">Pause courte (min)<input id="cfg-short" type="number" min="1" max="60" step="1"></label>
    <label class="field">Pause longue (min)<input id="cfg-long" type="number" min="1" max="90" step="1"></label>
    <label class="field">Sessions avant la pause longue<input id="cfg-cycles" type="number" min="1" max="12" step="1"></label>
    <label class="check"><input id="cfg-auto" type="checkbox"> Relancer la concentration après la pause</label>
    <label class="check"><input id="cfg-beep" type="checkbox"> Bip cardiaque</label>
    <label class="check"><input id="cfg-alarm" type="checkbox"> Alarme de fin de phase</label>
    <label class="check"><input id="cfg-demo" type="checkbox"> Mode démo (1 min = 1 s)</label>
  </form>

  <p class="hint">Aucun chiffre : seule la courbe indique où tu en es. Pendant une session, touche l'écran pour retrouver les commandes. Une pause prise plus tôt est raccourcie d'autant. <kbd>Espace</kbd> démarrer ou suspendre, <kbd>R</kbd> réinitialiser.</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
